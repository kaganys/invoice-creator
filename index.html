<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var key = 'bitz-designs-theme'
          var stored = localStorage.getItem(key)
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/branding/bitz-designs-icon.png" />
    <link rel="apple-touch-icon" href="/branding/bitz-designs-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Internal invoice creator for Bitz Designs."
    />
    <title>New Invoice · Bitz Designs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
